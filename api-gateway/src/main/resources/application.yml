server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      # credenciales del config-server en Render (perfil render); vacías en local
      username: ${WOK_INFRA_USER:}
      password: ${WOK_INFRA_PASSWORD:}
