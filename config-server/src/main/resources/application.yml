server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Configuración centralizada versionada junto al código. En producción puede
          # cambiarse a un repositorio Git con spring.cloud.config.server.git.uri.
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/config}

management:
  endpoints:
    web:
      exposure:
        include: health,info
