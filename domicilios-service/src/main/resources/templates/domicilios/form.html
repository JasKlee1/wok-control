<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.esNuevo()} ? 'Nuevo domicilio' : 'Editar domicilio')}"></head>
<body>
<!--/* v2 · HU-047 (CR-001): registrar o editar un domicilio. Al editar solo cambian los datos del cliente y el valor del domicilio (acta 2). */-->
<div class="wok-app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <div class="wok-main">
    <header th:replace="~{fragments/layout :: topbar(${form.esNuevo()} ? 'Nuevo domicilio' : 'Editar domicilio ' + ${existente?.numero}, ${form.esNuevo()} ? 'Pedido por teléfono: al guardar va directo a cocina' : 'Antes del despacho; los platos ya están en cocina')}"></header>
    <main class="wok-content">
      <div th:replace="~{fragments/layout :: mensajes}"></div>
      <form th:action="@{/domicilios/guardar}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
          <div class="col-xl-4 order-xl-2">
            <div class="wok-card mb-3">
              <div class="wok-card-header"><i class="bi bi-person-lines-fill text-wok"></i><h2>Cliente y entrega</h2></div>
              <div class="wok-card-body">
                <div class="mb-2">
                  <label class="form-label small" for="cliente">Nombre del cliente</label>
                  <input id="cliente" th:field="*{cliente}" class="form-control" maxlength="80" required
                         th:classappend="${campoError == 'cliente'} ? 'is-invalid'" placeholder="Ana Pérez">
                </div>
                <div class="mb-2">
                  <label class="form-label small" for="telefono">Teléfono (10 dígitos)</label>
                  <input id="telefono" th:field="*{telefono}" class="form-control" inputmode="tel" maxlength="20" required
                         th:classappend="${campoError == 'telefono'} ? 'is-invalid'" placeholder="3001234567">
                  <div class="invalid-feedback" th:if="${campoError == 'telefono'}" th:text="${error}">tel</div>
                </div>
                <div class="mb-2">
                  <label class="form-label small" for="direccion">Dirección</label>
                  <input id="direccion" th:field="*{direccion}" class="form-control" maxlength="150" required
                         th:classappend="${campoError == 'direccion'} ? 'is-invalid'" placeholder="Calle 45 # 13-20">
                  <div class="invalid-feedback" th:if="${campoError == 'direccion'}" th:text="${error}">dir</div>
                </div>
                <div class="mb-2">
                  <label class="form-label small" for="referencia">Barrio, apartamento o referencia</label>
                  <input id="referencia" th:field="*{referencia}" class="form-control" maxlength="150" placeholder="Torre 2, apto 501">
                </div>
                <div class="mb-2">
                  <label class="form-label small" for="valorDomicilio">Valor del domicilio</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input id="valorDomicilio" th:field="*{valorDomicilio}" type="number" min="0" max="100000" step="500" class="form-control" required
                           th:classappend="${campoError == 'valorDomicilio'} ? 'is-invalid'">
                  </div>
                </div>
                <div>
                  <label class="form-label small" for="observaciones">Observaciones</label>
                  <textarea id="observaciones" th:field="*{observaciones}" class="form-control" rows="2" maxlength="300" placeholder="Paga con billete de $50.000, timbre dañado…"></textarea>
                </div>
              </div>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-wok py-2" th:disabled="${form.esNuevo() and filas.isEmpty()}">
                <i class="bi" th:classappend="${form.esNuevo()} ? 'bi-send' : 'bi-save'"></i>
                <span th:text="${form.esNuevo()} ? 'Registrar y enviar a cocina' : 'Guardar cambios'">Guardar</span></button>
              <a th:href="${form.esNuevo()} ? @{/domicilios} : @{/domicilios/{id}(id=${form.id})}" class="btn btn-light">Volver</a>
            </div>
            <p class="small text-suave mt-2"><i class="bi bi-shield-lock"></i> Los datos del cliente solo los ven el cajero y el domiciliario asignado (Ley 1581).</p>
          </div>

          <div class="col-xl-8 order-xl-1">
            <div class="wok-card" th:if="${form.esNuevo()}">
              <div class="wok-card-header">
                <h2 class="me-auto">Platos</h2>
                <input class="form-control form-control-sm" style="max-width: 240px" placeholder="Buscar plato…" data-wok-buscar="#tablaCarta" aria-label="Buscar plato">
              </div>
              <div th:if="${filas.isEmpty()}">
                <div th:replace="~{fragments/layout :: vacio('bi-egg-fried', 'La carta está vacía', 'No hay platos disponibles para el domicilio.')}"></div>
              </div>
              <div class="table-responsive" th:unless="${filas.isEmpty()}">
                <table class="table table-wok align-middle" id="tablaCarta">
                  <thead><tr><th>Producto</th><th class="text-end">Precio</th><th style="width:90px">Cant.</th><th style="width:120px">Picante</th><th>Notas</th></tr></thead>
                  <tbody>
                    <th:block th:each="f : ${filas}">
                      <tr th:if="${f.primeraDeSeccion}" class="bg-crema"><td colspan="5" class="fw-semibold small text-uppercase" th:text="${f.categoria}">Cat</td></tr>
                      <tr th:with="l=${form.lineas[f.idx]}">
                        <td>
                          <input type="hidden" th:name="|lineas[${f.idx}].clave|" th:value="${l.clave}">
                          <div class="fw-semibold" th:text="${f.producto.nombre}">Plato</div>
                          <div class="small text-suave" th:text="${f.producto.descripcion}">desc</div>
                        </td>
                        <td class="text-end text-nowrap" th:text="${@fmt.dinero(f.producto.precio)}">$</td>
                        <td><input type="number" min="0" max="50" class="form-control form-control-sm" th:name="|lineas[${f.idx}].cantidad|" th:value="${l.cantidad}" aria-label="Cantidad"></td>
                        <td><select class="form-select form-select-sm" th:name="|lineas[${f.idx}].nivelPicante|" aria-label="Picante">
                          <option th:each="n : ${#numbers.sequence(0, 3)}" th:value="${n}" th:text="${n == 0} ? 'Sin picante' : 'Nivel ' + ${n}" th:selected="${n == l.nivelPicante}">0</option>
                        </select></td>
                        <td><input class="form-control form-control-sm" maxlength="200" th:name="|lineas[${f.idx}].notas|" th:value="${l.notas}" aria-label="Notas"></td>
                      </tr>
                    </th:block>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="wok-card" th:unless="${form.esNuevo()}">
              <div class="wok-card-header"><h2>Platos (ya en cocina)</h2></div>
              <div class="wok-card-body">
                <div class="d-flex justify-content-between" th:each="l : ${existente.lineas}">
                  <span th:text="${l.cantidad} + ' × ' + ${l.nombre}">1 x</span><span th:text="${@fmt.dinero(l.subtotal)}">$</span>
                </div>
                <p class="small text-suave mt-2 mb-0"><i class="bi bi-info-circle"></i> Para cambiar los platos, cancele el domicilio y regístrelo de nuevo.</p>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
