<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis entregas')}"></head>
<body>
<!--/* v2 · HU-049/050/052: el domiciliario ve solo sus domicilios (AC-049.1), sale, cobra y entrega, o registra que no se entregó. Pensada para el celular. */-->
<div class="wok-app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <div class="wok-main">
    <header th:replace="~{fragments/layout :: topbar('Mis entregas', 'Solo los domicilios que tiene asignados')}"></header>
    <main class="wok-content">
      <div th:replace="~{fragments/layout :: mensajes}"></div>
      <div class="d-flex mb-3"><a th:href="@{/mis-entregas}" class="btn btn-sm btn-wok-outline ms-auto"><i class="bi bi-arrow-clockwise"></i> Actualizar</a></div>

      <div th:if="${entregas.isEmpty()}" class="wok-card">
        <div th:replace="~{fragments/layout :: vacio('bi-geo-alt', 'Sin entregas asignadas', 'Cuando el cajero le asigne un domicilio, aparecerá aquí.')}"></div>
      </div>

      <div class="row g-3">
        <div class="col-md-6 col-xxl-4" th:each="d : ${entregas}">
          <div class="wok-card h-100">
            <div class="wok-card-header">
              <h2 class="me-auto wok-mono" th:text="${d.numero}">D-0001</h2>
              <span class="wok-badge" th:classappend="${d.estado.claseCss()}" th:text="${d.estado.etiqueta()}">E</span>
            </div>
            <div class="wok-card-body">
              <div class="fw-semibold" th:text="${d.cliente.nombre}">Cliente</div>
              <div><i class="bi bi-geo-alt"></i> <span th:text="${d.cliente.direccion}">dir</span></div>
              <div class="small text-suave" th:if="${d.cliente.referencia}" th:text="${d.cliente.referencia}">ref</div>
              <div><i class="bi bi-telephone"></i> <a th:href="'tel:' + ${d.cliente.telefono}" th:text="${d.cliente.telefono}">tel</a></div>
              <div class="h4 my-2" th:text="'Cobrar ' + ${@fmt.dinero(d.total)}">$</div>
              <div class="small text-suave" th:text="${d.unidades} + ' productos · pedido ' + ${d.pedidoNumero}">n</div>
              <div class="small text-suave" th:if="${d.observaciones}"><i class="bi bi-chat-left-text"></i> <span th:text="${d.observaciones}">obs</span></div>

              <div class="text-center my-3">
                <img th:src="@{/domicilios/{id}/qr-ruta.png(id=${d.id})}" width="170" height="170" alt="QR con la ruta" class="border rounded p-1 bg-white"
                     onerror="this.style.display='none'">
                <div><a th:href="${rutas[d.id]}" target="_blank" rel="noopener" class="btn btn-sm btn-wok-outline mt-1"><i class="bi bi-map"></i> Abrir ruta en Google Maps</a></div>
                <div class="small text-suave mt-1">QR: <span th:text="${qrProveedor}">api.qrserver.com</span></div>
              </div>

              <form th:if="${d.estado.name() == 'ASIGNADO'}" th:action="@{/mis-entregas/{id}/en-camino(id=${d.id})}" method="post" class="d-grid">
                <button class="btn btn-wok py-2" type="submit"><i class="bi bi-bicycle"></i> Salgo: en camino</button>
              </form>

              <th:block th:if="${d.estado.name() == 'EN_CAMINO'}">
                <form th:action="@{/mis-entregas/{id}/entregar(id=${d.id})}" method="post" class="border rounded p-2 mb-2">
                  <div class="fw-semibold small mb-1"><i class="bi bi-cash-coin"></i> Cobro contra entrega</div>
                  <div class="row g-2">
                    <div class="col-6"><select name="metodo" class="form-select" aria-label="Método de pago" required>
                      <option th:each="m : ${metodos}" th:value="${m.name()}" th:text="${m.etiqueta()}">Efectivo</option>
                    </select></div>
                    <div class="col-6"><input name="monto" type="number" min="1" step="50" class="form-control" required inputmode="numeric"
                                              th:value="${d.total.toBigInteger()}" aria-label="Monto recibido"></div>
                    <div class="col-12"><input name="referencia" class="form-control form-control-sm" maxlength="60" placeholder="Aprobación del datáfono (si es tarjeta)"></div>
                  </div>
                  <div class="d-grid mt-2"><button class="btn btn-success py-2" type="submit"><i class="bi bi-check2-circle"></i> Cobrado y entregado</button></div>
                </form>
                <details>
                  <summary class="small text-danger">El cliente no estaba</summary>
                  <form th:action="@{/mis-entregas/{id}/no-entregado(id=${d.id})}" method="post" class="mt-2"
                        data-wok-confirmar="El pedido se anulará sin factura y debe volver al restaurante. ¿Confirmar?">
                    <input name="motivo" class="form-control mb-2" minlength="10" maxlength="200" required placeholder="Cliente no contesta (mínimo 10 caracteres)">
                    <div class="d-grid"><button class="btn btn-outline-danger" type="submit"><i class="bi bi-house-x"></i> No entregado</button></div>
                  </form>
                </details>
              </th:block>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
