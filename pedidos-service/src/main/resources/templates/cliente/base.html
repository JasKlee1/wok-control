<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--/*
  v2 · Épica 7 · T016 (HU-039, NFR-WOK-001): base liviana de las pantallas del cliente.
  - Sin Bootstrap: el CSS va en línea (unos 4 KB) y solo se pide la fuente de íconos.
  - Pensada desde 360 px: nada tiene ancho fijo mayor que la pantalla y los botones miden al menos 44 px.
*/-->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242424">
  <title th:text="${titulo} + ' · Wok Control'">Wok Control</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/wok-static/images/logo.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px;
      line-height: 1.4; color: #242424; background: #FFF8EE; overflow-x: hidden; }
    img { max-width: 100%; }
    button, input, textarea { font: inherit; }
    .c-top { position: sticky; top: 0; z-index: 10; background: #242424; color: #fff; padding: .6rem 1rem;
      display: flex; align-items: center; gap: .6rem; }
    .c-top img { width: 32px; height: 32px; flex: 0 0 32px; }
    .c-top .marca { font-weight: 600; line-height: 1.1; }
    .c-top small { opacity: .75; font-size: .78rem; }
    .c-top .mesa { margin-left: auto; background: #A61B1B; border-radius: 999px; padding: .2rem .75rem; font-weight: 600;
      white-space: nowrap; }
    .c-main { max-width: 760px; margin: 0 auto; padding: 1rem; }
    .c-msg { border-radius: 10px; padding: .7rem .9rem; margin-bottom: .8rem; display: flex; gap: .5rem; align-items: flex-start; }
    .c-msg.ok { background: #e6f4ea; color: #1e5e2e; }
    .c-msg.err { background: #fde8e8; color: #8a1c1c; }
    .c-msg.warn { background: #fff4d6; color: #7a5600; }
    .c-btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; min-height: 44px;
      min-width: 44px; padding: .45rem .9rem; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
      text-decoration: none; font-weight: 600; background: #A61B1B; color: #fff; }
    .c-btn.sec { background: #fff; color: #A61B1B; border-color: #e8c9c9; }
    .c-btn.gris { background: #f1ece6; color: #555; }
    .c-btn.ancho { width: 100%; }
    .c-btn[disabled] { opacity: .5; cursor: not-allowed; }
    .c-card { background: #fff; border-radius: 12px; padding: .8rem; margin-bottom: .8rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .c-chip { font-size: .74rem; border-radius: 999px; padding: .1rem .55rem; background: #f6efe6; color: #7a5b3a; white-space: nowrap; }
    .c-chip.espera { background: #fff4d6; color: #7a5600; }
    .c-chip.cocina { background: #e7eefc; color: #23408e; }
    .c-chip.listo { background: #e6f4ea; color: #1e5e2e; }
    .c-chip.rechazo { background: #fde8e8; color: #8a1c1c; }
    .c-vacio { text-align: center; color: #777; padding: 2.5rem 1rem; }
    .c-vacio i { font-size: 2.4rem; display: block; margin-bottom: .5rem; }
    .c-pie { text-align: center; color: #777; font-size: .85rem; padding: 1.5rem 1rem 6rem; }
    .c-barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
      background: #242424; }
    .c-barra .c-btn { width: 100%; max-width: 760px; margin: 0 auto; display: flex; }
    .c-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>

<header th:fragment="top(subtitulo)" class="c-top">
  <img th:src="@{/wok-static/images/logo.svg}" alt="" width="32" height="32">
  <div>
    <div class="marca">Wok Control</div>
    <small th:text="${subtitulo}">Carta del restaurante</small>
  </div>
  <span class="mesa" th:text="'Mesa ' + ${mesaNumero}">Mesa 5</span>
</header>

<th:block th:fragment="mensajes">
  <div class="c-msg ok" role="status" th:if="${exito != null}"><i class="bi bi-check-circle"></i><span th:text="${exito}">Listo</span></div>
  <div class="c-msg err" role="alert" th:if="${error != null}"><i class="bi bi-exclamation-triangle"></i><span th:text="${error}">Error</span></div>
</th:block>

</body>
</html>
