<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--/* v2 · Épica 7 · HU-033: carta del cliente por QR. Pensada para celular (360 px en adelante). */-->
<head th:replace="~{fragments/layout :: head('Carta · Mesa ' + ${mesaNumero})}"></head>
<body class="cliente-body">
<style>
  .cliente-body { background: #FFF8EE; }
  .cliente-top { position: sticky; top: 0; z-index: 10; background: #242424; color: #fff; padding: .75rem 1rem;
    display: flex; align-items: center; gap: .75rem; }
  .cliente-top img { width: 34px; height: 34px; }
  .cliente-top .mesa { margin-left: auto; background: #A61B1B; border-radius: 999px; padding: .2rem .8rem; font-weight: 600; }
  .cliente-nav { display: flex; gap: .5rem; overflow-x: auto; padding: .6rem 1rem; background: #fff; border-bottom: 1px solid #eee; }
  .cliente-nav a { white-space: nowrap; text-decoration: none; color: #A61B1B; border: 1px solid #e8c9c9; border-radius: 999px;
    padding: .25rem .8rem; font-size: .9rem; }
  .cliente-main { max-width: 760px; margin: 0 auto; padding: 1rem; }
  .cliente-seccion h2 { font-size: 1.15rem; color: #A61B1B; margin: 1.2rem 0 .6rem; scroll-margin-top: 110px; }
  .plato { display: flex; gap: .8rem; background: #fff; border-radius: 12px; padding: .7rem; margin-bottom: .7rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .plato-foto { flex: 0 0 92px; width: 92px; height: 92px; border-radius: 10px; object-fit: cover; background: #f3e7d9;
    display: flex; align-items: center; justify-content: center; color: #c9a37b; font-size: 2rem; }
  .plato-info { flex: 1; min-width: 0; }
  .plato-nombre { font-weight: 600; margin: 0; }
  .plato-desc { font-size: .88rem; color: #666; margin: .15rem 0 .35rem; }
  .plato-pie { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .plato-precio { font-weight: 700; color: #242424; margin-right: auto; }
  .chip { font-size: .72rem; border-radius: 999px; padding: .1rem .5rem; background: #f6efe6; color: #7a5b3a; }
  .picante { color: #d0342c; font-size: .85rem; }
  .cliente-pie { text-align: center; color: #777; font-size: .85rem; padding: 1.5rem 1rem 2.5rem; }
</style>

<header class="cliente-top">
  <img th:src="@{/wok-static/images/logo.svg}" alt="">
  <div>
    <div class="fw-semibold">Wok Control</div>
    <small class="opacity-75">Carta del restaurante</small>
  </div>
  <span class="mesa" th:text="'Mesa ' + ${mesaNumero}">Mesa 5</span>
</header>

<nav class="cliente-nav" aria-label="Categorías" th:if="${!secciones.isEmpty()}">
  <a th:each="s, i : ${secciones}" th:href="'#sec-' + ${i.index}" th:text="${s.nombre}">Arroces</a>
</nav>

<main class="cliente-main">
  <div th:if="${secciones.isEmpty()}" class="text-center text-muted py-5">
    <i class="bi bi-hourglass-split fs-1 d-block mb-2"></i>
    En este momento no hay platos disponibles. Pide ayuda al personal.
  </div>

  <section class="cliente-seccion" th:each="s, i : ${secciones}" th:id="'sec-' + ${i.index}">
    <h2 th:text="${s.nombre}">Arroces</h2>
    <article class="plato" th:each="p : ${s.platos}">
      <img th:if="${p.imagenId != null}" class="plato-foto" loading="lazy"
           th:src="@{/menu/imagenes/{id}(id=${p.imagenId})}" th:alt="${p.nombre}">
      <div th:unless="${p.imagenId != null}" class="plato-foto" aria-hidden="true"><i class="bi bi-egg-fried"></i></div>
      <div class="plato-info">
        <p class="plato-nombre">
          <span th:text="${p.nombre}">Arroz chino especial</span>
          <span th:if="${p.combo}" class="chip ms-1">Combo</span>
        </p>
        <p class="plato-desc" th:if="${p.descripcion != null and !#strings.isEmpty(p.descripcion)}" th:text="${p.descripcion}">Descripción</p>
        <div class="plato-pie">
          <span class="plato-precio" th:text="${p.precio}">$28.000</span>
          <span class="picante" th:if="${p.picante > 0}" th:title="'Picante nivel ' + ${p.picante}">
            <i class="bi bi-fire" th:each="n : ${#numbers.sequence(1, p.picante)}"></i>
          </span>
          <span class="chip" th:each="a : ${p.alergenos}" th:text="${a}">MARISCOS</span>
        </div>
      </div>
    </article>
  </section>
</main>

<footer class="cliente-pie">
  Solo se muestran los platos disponibles en este momento.<br>
  Para hacer tu pedido, llama a tu mesero.
</footer>
</body>
</html>
