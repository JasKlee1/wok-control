<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedido mesa ' + ${mesa.numero})}"></head>
<body>
<div class="wok-app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <div class="wok-main">
    <header th:replace="~{fragments/layout :: topbar((${form.esNuevo()} ? 'Nuevo pedido' : 'Modificar pedido') + ' · Mesa ' + ${mesa.numero}, 'Seleccione cantidades; el precio lo fija la carta vigente')}"></header>
    <main class="wok-content">
      <div th:replace="~{fragments/layout :: mensajes}"></div>
      <form th:action="@{/pedidos/guardar}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{mesaId}">
        <div class="row g-3">
          <div class="col-xl-8">
            <div class="wok-card">
              <div class="wok-card-header">
                <h2 class="me-auto">Carta disponible</h2>
                <input class="form-control form-control-sm" style="max-width: 240px" placeholder="Buscar plato…" data-wok-buscar="#tablaCarta" aria-label="Buscar plato">
              </div>
              <div th:if="${carta.isEmpty()}">
                <div th:replace="~{fragments/layout :: vacio('bi-egg-fried', 'La carta está vacía', 'No hay platos disponibles. El administrador debe registrar o habilitar platos en el menú.')}"></div>
              </div>
              <div class="table-responsive" th:unless="${carta.isEmpty()}">
                <table class="table table-wok align-middle" id="tablaCarta">
                  <thead><tr><th>Producto</th><th class="text-end">Precio</th><th style="width:96px">Cant.</th><th style="width:120px">Picante</th><th>Notas</th></tr></thead>
                  <tbody>
                    <th:block th:each="s : ${carta}">
                      <tr class="bg-crema"><td colspan="5" class="fw-semibold small text-uppercase" style="letter-spacing:1px" th:text="${s.categoria}">Categoría</td></tr>
                      <tr th:each="pr : ${s.productos}" th:with="l=${form.linea(pr.tipo + ':' + pr.id)}, idx=${form.lineas.indexOf(form.linea(pr.tipo + ':' + pr.id))}">
                        <td>
                          <input type="hidden" th:name="|lineas[${idx}].clave|" th:value="${l.clave}">
                          <div class="d-flex gap-2 align-items-start">
                            <img th:if="${pr.imagenId != null}" th:src="@{/menu/imagenes/{f}(f=${pr.imagenId})}" class="wok-foto-mini" alt="" loading="lazy">
                            <div>
                              <div class="fw-semibold" th:text="${pr.nombre}">Plato</div>
                              <div class="small text-suave" th:text="${pr.descripcion}">desc</div>
                              <span th:each="a : ${pr.alergenos}" class="wok-badge alerta me-1" th:text="${a}">A</span>
                            </div>
                          </div>
                        </td>
                        <td class="text-end text-nowrap" th:text="${@fmt.dinero(pr.precio)}">$</td>
                        <td><input type="number" min="0" max="50" class="form-control form-control-sm" th:name="|lineas[${idx}].cantidad|" th:value="${l.cantidad}" aria-label="Cantidad"></td>
                        <td><select class="form-select form-select-sm" th:name="|lineas[${idx}].nivelPicante|" aria-label="Nivel de picante">
                          <option th:each="n : ${#numbers.sequence(0, 3)}" th:value="${n}" th:text="${n == 0} ? 'Sin picante' : 'Nivel ' + ${n}" th:selected="${n == l.nivelPicante}">0</option>
                        </select></td>
                        <td><input class="form-control form-control-sm" maxlength="200" th:name="|lineas[${idx}].notas|" th:value="${l.notas}" placeholder="Sin cebolla, término…" aria-label="Notas"></td>
                      </tr>
                    </th:block>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="wok-card mb-3">
              <div class="wok-card-header"><i class="bi bi-exclamation-octagon text-danger"></i><h2>Alergias declaradas</h2></div>
              <div class="wok-card-body d-flex flex-wrap gap-2">
                <label th:each="a : ${alergias}" class="border rounded-pill px-3 py-1" style="cursor:pointer">
                  <input type="checkbox" class="form-check-input me-1" name="alergias" th:value="${a}" th:checked="${#sets.contains(form.alergias, a)}">
                  <span th:text="${a}">A</span>
                </label>
              </div>
            </div>
            <div class="wok-card mb-3">
              <div class="wok-card-header"><i class="bi bi-chat-left-text text-wok"></i><h2>Observaciones e instrucciones</h2></div>
              <div class="wok-card-body">
                <textarea th:field="*{observaciones}" class="form-control" rows="3" maxlength="300" placeholder="Cumpleaños, servir entradas primero…"></textarea>
              </div>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-wok py-2" th:disabled="${carta.isEmpty()}"><i class="bi bi-save"></i> Guardar pedido</button>
              <a th:href="${form.esNuevo()} ? @{/mesas} : @{/pedidos/{id}(id=${form.id})}" class="btn btn-light">Cancelar</a>
            </div>
            <p class="small text-suave mt-2"><i class="bi bi-info-circle"></i> El pedido queda <strong>abierto</strong> y se puede modificar hasta enviarlo a cocina.</p>
          </div>
        </div>
      </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
