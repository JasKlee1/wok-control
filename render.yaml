# =============================================================================
# Blueprint de Render: despliega Wok Control como 10 servicios web independientes,
# uno por microservicio, todos construidos con el mismo Dockerfile (variable MODULO).
#
# Antes de usarlo, cree en Render el grupo de variables "wok-secretos" con:
#   MONGODB_URI, JWT_SECRET y WOK_INFRA_PASSWORD   (ver docs/despliegue-render.md)
#
# Las URL públicas siguen el nombre de cada servicio: https://<nombre>.onrender.com.
# Si Render asigna otra URL (nombre ocupado), corrija CONFIG_SERVER_URL, EUREKA_HOST y
# WOK_CORS_ORIGINS abajo o en el panel de Render.
# Plan: free (0,1 CPU, 512 MB, se duerme tras 15 min sin tráfico). Para producción cambie cada
# servicio a un plan pago desde el panel de Render (Settings > Instance Type).
# =============================================================================
services:

  - type: web
    name: wokcontrol-exito-config
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - config-server/**
        - pom.xml
        - Dockerfile
        - .mvn/**
        - mvnw
    envVars:
      - key: MODULO
        value: "config-server"
      - key: SPRING_PROFILES_ACTIVE
        value: "native,render"
      - key: CONFIG_SERVER_PORT
        value: "10000"
      - key: WOK_INFRA_USER
        value: "wok"
      - fromGroup: wok-secretos

