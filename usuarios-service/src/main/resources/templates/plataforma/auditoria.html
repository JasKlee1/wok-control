<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auditoría')}"></head>
<body>
<div class="wok-app">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <div class="wok-main">
    <header th:replace="~{fragments/layout :: topbar('Auditoría', 'Quién hizo qué, cuándo y en qué servicio')}"></header>
    <main class="wok-content">
      <div class="wok-card">
        <div class="wok-card-header">
          <form class="wok-filtros flex-grow-1" method="get" th:action="@{/plataforma/auditoria}">
            <div><label class="form-label small mb-1" for="usuario">Usuario</label>
              <input id="usuario" name="usuario" class="form-control form-control-sm" th:value="${usuario}"></div>
            <div><label class="form-label small mb-1" for="servicio">Servicio</label>
              <select id="servicio" name="servicio" class="form-select form-select-sm">
                <option value="">Todos</option>
                <option th:each="s : ${servicios}" th:value="${s}" th:text="${s}" th:selected="${s == servicio}">s</option>
              </select></div>
            <div><label class="form-label small mb-1" for="q">Texto</label>
              <input id="q" name="q" class="form-control form-control-sm" th:value="${q}" placeholder="Acción, entidad, detalle"></div>
            <div><label class="form-label small mb-1" for="desde">Desde</label>
              <input id="desde" name="desde" type="date" class="form-control form-control-sm" th:value="${desde}"></div>
            <div><label class="form-label small mb-1" for="hasta">Hasta</label>
              <input id="hasta" name="hasta" type="date" class="form-control form-control-sm" th:value="${hasta}"></div>
            <button class="btn btn-sm btn-wok-outline" type="submit"><i class="bi bi-funnel"></i> Filtrar</button>
          </form>
        </div>
        <div th:if="${pagina.empty}">
          <div th:replace="~{fragments/layout :: vacio('bi-journal-text', 'Sin eventos', 'No hay eventos de auditoría para los filtros seleccionados.')}"></div>
        </div>
        <div class="table-responsive" th:unless="${pagina.empty}">
          <table class="table table-wok table-hover">
            <thead><tr><th>Fecha</th><th>Usuario</th><th>Servicio</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr></thead>
            <tbody>
              <tr th:each="e : ${pagina.content}">
                <td class="small text-nowrap" th:text="${@fmt.fechaHora(e.fecha)}">fecha</td>
                <td class="wok-mono small" th:text="${e.usuario}">usuario</td>
                <td class="small" th:text="${e.servicio}">servicio</td>
                <td><span class="wok-badge rojo" th:text="${e.accion}">ACCION</span></td>
                <td class="small"><span th:text="${e.entidad}">Entidad</span> <span class="wok-mono text-suave" th:text="${e.entidadId}">id</span></td>
                <td class="small" th:text="${e.detalle}">detalle</td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav th:replace="~{fragments/layout :: paginacion(${pagina}, ${baseUrl})}"></nav>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
