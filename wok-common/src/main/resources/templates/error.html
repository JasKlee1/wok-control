<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="wok-app">
  <th:block th:if="${usuarioActual != null}"><aside th:replace="~{fragments/layout :: sidebar}"></aside></th:block>
  <div class="wok-main" th:style="${usuarioActual == null} ? 'margin-left:0'">
    <th:block th:if="${usuarioActual != null}"><header th:replace="~{fragments/layout :: topbar('Algo salió mal', '')}"></header></th:block>
    <main class="wok-content d-flex align-items-center justify-content-center">
      <div class="wok-card text-center p-4 p-md-5" style="max-width: 560px">
        <img th:src="@{/wok-static/images/logo.svg}" alt="" width="72" class="mb-3">
        <div class="wok-titulo text-wok" style="font-size: 3rem; line-height: 1" th:text="${status} ?: 'Error'">500</div>
        <div class="wok-divisor mx-auto" style="max-width: 200px"></div>
        <h2 class="h4" th:switch="${status}">
          <span th:case="404">No encontramos lo que busca</span>
          <span th:case="403">No tiene acceso a este recurso</span>
          <span th:case="503">Un servicio no está disponible</span>
          <span th:case="*">Ocurrió un problema</span>
        </h2>
        <p class="text-suave" th:text="${message != null and message != '' and message != 'No message available'} ? ${message} : 'La operación no pudo completarse. Intente nuevamente.'">Detalle</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <a th:href="@{/dashboard}" class="btn btn-wok"><i class="bi bi-house"></i> Ir al panel</a>
          <a href="javascript:history.back()" class="btn btn-wok-outline"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
      </div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
